# Called by release.yml as dist's custom publish job (publish-jobs = ["./npm-publish"]).
# Publishes through npm Trusted Publishing (OIDC); npm matches the trusted
# publisher against the caller workflow, release.yml.
name: npm-publish

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: "ubuntu-22.04"
    # A called job cannot exceed the caller's grant, which carries no contents scope.
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # Trusted Publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
