[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Release runs only on tag pushes; CI covers build and test
pr-run-mode = "skip"

# dist 0.32.0 defaults arm64 macOS to macos-14, which GitHub retires (actions/runner-images#13518)
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
